[package]
name = "prompthive"
version = "0.6.1"
edition = "2021"
rust-version = "1.89"
authors = ["Jory Pestorious <jory@pestorious.com>"]
description = "A local-first prompt toolkit for your terminal"
repository = "https://github.com/joryeugene/prompthive"
readme = "README.md"
license = "MIT"
keywords = ["prompts", "cli", "productivity", "terminal"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*", "CONTRIBUTING.md", "examples/**", "tests/**", "docs/comeback-spec.md", "docs/assets/**"]
autobins = false

[[bin]]
name = "ph"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-segmentation"]
# Old local feature names remain harmless compatibility switches.
compose = []
import = []
full = ["tui"]
dev = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { version = "0.29", optional = true }
dirs = "5.0"
fuzzy-matcher = "0.3"
gethostname = "0.4"
libc = "0.2"
md5 = "0.7"
once_cell = "1.19"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"], optional = true }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# shortcut: preserve arbitrary legacy YAML values/tags until a maintained parser
# proves lossless compatibility; track the maintenance advisory before release.
serde_yaml = "0.9"
sha2 = "0.10"
shellexpand = "3.1"
shlex = "1.3"
signal-hook = "0.3"
tempfile = "3.10"
toml = "0.8"
unicode-segmentation = { version = "1.13", optional = true }
uuid = { version = "1.8", features = ["v4"] }
walkdir = "2.5"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
copypasta = { version = "0.10", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Darwin kqueue cannot register /dev/tty when prompt context comes from a pipe.
crossterm = { version = "0.29", optional = true, features = ["use-dev-tty"] }

[profile.release]
strip = true
lto = "thin"
