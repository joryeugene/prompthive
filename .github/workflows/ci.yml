name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check the core and disposable CLI examples offline
        run: bash scripts/check
      - name: Install and exercise the actual default and headless packages offline
        run: bash scripts/test-installed

  msrv:
    name: Declared minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read the minimum version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          version=$(sed -nE 's/^rust-version *= *"([^"]+)".*/\1/p' Cargo.toml)
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Test default and headless builds offline
        run: |
          cargo test --locked --offline
          cargo test --locked --offline --no-default-features

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
      - name: Scan all commits with default rules and exact fixture exceptions
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts="--all" --config .gitleaks.toml .'
